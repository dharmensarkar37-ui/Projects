<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form 2</title>
</head>
<body>
    <form >
        <fieldset>
        <legend>Personal Info</legend>
        <label for="name">Name</label>
        <input id="name" type="text" placeholder="Name"/><br/><br/>
        <label for="email" >Email</label>
        <input id="email" type="email" placeholder="Email"/><br/><br/>
        <label for="mobile" >Mobile</label>
        <input id="mobile" type="number" placeholder="Mobile"/><br/><br/>
        <label for="dob" >Date of Birth</label>
        <input id="dob" type="date" placeholder="date"/><br/><br/>
    </fieldset>
    <fieldset>
        <legend>Address</legend>
        <input id="line1" type="text" placeholder="Line 1"/><br/><br/>
        <input id="line2" type="text" placeholder="Line 2"/><br/><br/>
        <input id="locality" type="text" placeholder="Locality or City"/><br/><br/>
        <input id="" type="number" placeholder="Pin Code"/><br/><br/>
        <input id="" type="text" placeholder="State"/><br/><br/>
    </fieldset>
    <span>Accept terms and conditions</span><input type="checkbox"/>
    </form>
</body>
</html>
